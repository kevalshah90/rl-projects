<h2 class="sr-only">Animated prime-rl loop showing asynchronous overlap: the next step's attempts are sampled with the old policy while the trainer updates, so the next batch arrives one version stale.</h2>

<script>
const SX=[92,192,292,392];
const C={req:"#1D9E75",tok:"#7F77DD",sol:"#888780",pass:"#639922",fail:"#E24B4A",bat:"#EF9F27",w:"#534AB7"};
const up=i=>[[SX[i],290],[SX[i],250],[340,250],[340,206],[290,150],[290,132],[150,132],[150,112]];
const down=i=>up(i).slice().reverse();
const start=i=>[[340,206],[340,250],[SX[i],250],[SX[i],290]];
const tog=i=>[[SX[i],334],[SX[i],362],[570,362],[570,334]];
const gback=[[570,290],[570,240],[420,240],[420,206]];
const totr=[[390,150],[390,132],[530,132],[530,112]];
const wts=[[440,84],[240,84]];
const R=[1,0,0,1],R2=[0,1,0,0];
const all=f=>[0,1,2,3].map(f);
const clr=()=>{for(let i=0;i<4;i++)set("r"+i,"")};
const P=[
{t:"1. Step 1 starts",x:"The orchestrator opens 4 sandboxes per task (32 attempts in a real step). vLLM serves policy v1, the untrained model.",d:2000,on:["b-or","b-s0","b-s1","b-s2","b-s3"],pk:all(i=>({p:start(i),c:C.req,dl:i*.08})),pre:()=>{clr();set("badge","");set("sblab","Step 1 attempts, sampled from v1");set("osub","interception server");set("tsub","weights v1, idle");set("isub","serving policy v1")}},
{t:"2. Model calls go through the orchestrator",x:"Each agent's request goes sandbox → interception server → vLLM. vLLM answers with v1, and the orchestrator records every token and its probability, tagged with the version that produced it.",d:2600,on:["b-or","b-inf"],pk:all(i=>({p:up(i),c:C.req,dl:i*.06})).concat(all(i=>({p:down(i),c:C.tok,dl:.45+i*.05}))),pre:()=>set("osub","recording tokens, tagged v1")},
{t:"3. Turns repeat, up to 30 per attempt",x:"Sandboxes run each tool call (write the kernel, run the check), then ask the model again. This is the slow part: minutes per attempt.",d:2600,on:["b-s0","b-s1","b-s2","b-s3","b-inf"],pk:all(i=>({p:up(i),c:C.req,dl:i*.12})).concat(all(i=>({p:down(i),c:C.tok,dl:.45+i*.08})))},
{t:"4. Grade",x:"Each solution.py goes to a fresh grader. Rewards come back: attempts 1 and 4 pass.",d:2600,on:["b-gr","b-or"],pk:all(i=>({p:tog(i),c:C.sol,dl:i*.06})).concat(all(i=>({p:gback,c:R[i]?C.pass:C.fail,dl:.45+i*.08}))),post:()=>{for(let i=0;i<4;i++)set("r"+i,"reward "+R[i])}},
{t:"5. Batch A to the trainer, and step 2 starts at once",as:1,x:"The orchestrator sends batch A (data from v1) to the trainer. It doesn't wait for training to finish: it immediately opens step 2's sandboxes, because vLLM would otherwise sit idle. This is the asynchronous part.",d:2600,on:["b-or","b-tr","b-s0","b-s1","b-s2","b-s3"],pk:[{p:totr,c:C.bat,dl:0,r:7}].concat(all(i=>({p:start(i),c:C.req,dl:.35+i*.06}))),pre:()=>set("osub","adv +0.5 −0.5 −0.5 +0.5"),post:()=>{clr();set("sblab","Step 2 attempts, sampled from v1 (v2 not ready yet)");set("tsub","training on batch A");set("osub","interception server")}},
{t:"6. Overlap: training while sampling",as:1,x:"The trainer turns batch A into v2. Meanwhile step 2's agents keep calling vLLM, which still holds v1, so step 2's tokens are tagged v1. Both GPUs are busy at once. That's the point of async.",d:3200,on:["b-tr","b-inf","b-s0","b-s1","b-s2","b-s3"],pk:all(i=>({p:up(i),c:C.req,dl:i*.1})).concat(all(i=>({p:down(i),c:C.tok,dl:.45+i*.08}))),pre:()=>{set("badge","async: training v1 → v2 while vLLM samples v1");set("tsub","computing v1 → v2")}},
{t:"7. v2 arrives at vLLM mid-rollout",as:1,x:"The trainer pushes the new adapter and vLLM switches to v2. Step 2's attempts are already partway done: their early turns came from v1. Turns from now on would come from v2.",d:2400,on:["b-tr","b-inf"],pk:[{p:wts,c:C.w,dl:0,r:8}],post:()=>{set("isub","serving policy v2");set("tsub","weights v2, waiting");set("badge","");set("sblab","Step 2 attempts: mostly v1 tokens, later turns v2")}},
{t:"8. Step 2 finishes and is graded",x:"Same as before: solution.py to the grader, rewards back. This time only attempt 2 passes.",d:2600,on:["b-gr","b-or"],pk:all(i=>({p:tog(i),c:C.sol,dl:i*.06})).concat(all(i=>({p:gback,c:R2[i]?C.pass:C.fail,dl:.45+i*.08}))),post:()=>{for(let i=0;i<4;i++)set("r"+i,"reward "+R2[i])}},
{t:"9. Batch B arrives one version stale",as:1,x:"The trainer now holds v2, but batch B was mostly sampled by v1: staleness = 2 − 1 = 1. With max_staleness = 1 it's kept. The ratio p_train ÷ p_vLLM corrects for the gap, and IPO drops tokens that drifted more than 0.3. A batch older than max_staleness would be discarded.",d:3000,on:["b-or","b-tr"],pk:[{p:totr,c:C.bat,dl:0,r:7}],pre:()=>{set("osub","adv −0.25 +0.75 −0.25 −0.25");set("badge","staleness 1 ≤ max_staleness 1: keep")},post:()=>set("tsub","batch B: v1 data, weights v2")}];
const NS="http://www.w3.org/2000/svg";let ph=0,t0=null,play=!matchMedia("(prefers-reduced-motion: reduce)").matches,el=0,dots=[];
function set(id,v){document.getElementById(id).textContent=v}
function at(p,f){let L=[],T=0;for(let i=1;i<p.length;i++){const l=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);L.push(l);T+=l}let d=f*T;for(let i=0;i<L.length;i++){if(d<=L[i]){const k=L[i]?d/L[i]:0;return[p[i][0]+(p[i+1][0]-p[i][0])*k,p[i][1]+(p[i+1][1]-p[i][1])*k]}d-=L[i]}return p[p.length-1]}
function hl(ids){document.querySelectorAll("#sv rect[id^=b-]").forEach(r=>r.style.strokeWidth=ids.includes(r.id)?"2":"0.5")}
function enter(){const s=P[ph];if(s.pre)s.pre();set("ct",s.t);set("cx",s.x);hl(s.on);
const g=document.getElementById("pk");g.innerHTML="";dots=s.pk.map(k=>{const c=document.createElementNS(NS,"circle");c.setAttribute("r",k.r||5);c.setAttribute("fill",k.c);c.setAttribute("opacity",0);g.appendChild(c);return{c,k}});
document.getElementById("ph").innerHTML=P.map((q,i)=>`<button class="pd ${q.as?"as":""} ${i===ph?"on":""}" onclick="jump(${i})">${i+1}</button>`).join("");el=0;t0=null}
function leave(){const s=P[ph];if(s.post)s.post()}
function frame(ts){if(play){if(t0===null)t0=ts-el;el=ts-t0;const s=P[ph],f=Math.min(el/s.d,1);
dots.forEach(({c,k})=>{const span=Math.max(.5,1-k.dl);const q=Math.min(Math.max((f-k.dl)/span,0),1);const[x,y]=at(k.p,q);c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("opacity",q>0&&q<1?1:0)});
if(f>=1){leave();ph=(ph+1)%P.length;enter()}}else{t0=null}requestAnimationFrame(frame)}
function toggle(){play=!play;set("pp",play?"Pause":"Play")}
function nextPh(){leave();ph=(ph+1)%P.length;enter();play=false;set("pp","Play")}
function jump(i){ph=i;enter();play=false;set("pp","Play")}
function restart(){ph=0;enter();play=true;set("pp","Pause")}
set("pp",play?"Pause":"Play");enter();requestAnimationFrame(frame);
</script>
